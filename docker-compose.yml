version: '3.9'

networks:
  saas-network:
    driver: bridge

volumes:
  mongo-auth-data:
  mongo-user-data:
  mongo-restaurant-data:
  mongo-menu-data:
  mongo-order-data:
  mongo-review-data:
  mongo-analytics-data:
  redis-data:

services:
  # ─── Infrastructure ───────────────────────────────────────────────
  nginx:
    build: ./nginx
    container_name: nginx-gateway
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
    networks:
      - saas-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password123
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Databases ────────────────────────────────────────────────────
  mongo-auth:
    image: mongo:7
    container_name: mongo-auth
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: auth-db
    volumes:
      - mongo-auth-data:/data/db
    networks:
      - saas-network
    restart: unless-stopped

  mongo-user:
    image: mongo:7
    container_name: mongo-user
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: users-db
    volumes:
      - mongo-user-data:/data/db
    networks:
      - saas-network
    restart: unless-stopped

  mongo-restaurant:
    image: mongo:7
    container_name: mongo-restaurant
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: restaurants-db
    volumes:
      - mongo-restaurant-data:/data/db
    networks:
      - saas-network
    restart: unless-stopped

  mongo-menu:
    image: mongo:7
    container_name: mongo-menu
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: menu-db
    volumes:
      - mongo-menu-data:/data/db
    networks:
      - saas-network
    restart: unless-stopped

  mongo-order:
    image: mongo:7
    container_name: mongo-order
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: orders-db
    volumes:
      - mongo-order-data:/data/db
    networks:
      - saas-network
    restart: unless-stopped

  mongo-review:
    image: mongo:7
    container_name: mongo-review
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: reviews-db
    volumes:
      - mongo-review-data:/data/db
    networks:
      - saas-network
    restart: unless-stopped

  mongo-analytics:
    image: mongo:7
    container_name: mongo-analytics
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
      MONGO_INITDB_DATABASE: analytics-db
    volumes:
      - mongo-analytics-data:/data/db
    networks:
      - saas-network
    restart: unless-stopped

  # ─── API Gateway ─────────────────────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USER_SERVICE_URL=http://user-service:3002
      - RESTAURANT_SERVICE_URL=http://restaurant-service:3003
      - MENU_SERVICE_URL=http://menu-service:3004
      - CART_SERVICE_URL=http://cart-service:3006
      - ORDER_SERVICE_URL=http://order-service:3007
      - ANALYTICS_SERVICE_URL=http://analytics-service:3009
      - REVIEW_SERVICE_URL=http://review-service:3010
      - LOCATION_SERVICE_URL=http://location-service:3011
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
    depends_on:
      - redis
      - rabbitmq
    networks:
      - saas-network
    restart: unless-stopped

  # ─── Microservices ────────────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - MONGO_URI=mongodb://root:rootpassword@mongo-auth:27017/auth-db?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - JWT_REFRESH_SECRET=your_refresh_secret_change_in_production
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - RABBITMQ_URL=amqp://admin:password123@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USER=your_email@gmail.com
      - SMTP_PASS=your_app_password
      - CLIENT_URL=http://localhost:3000
    depends_on:
      - mongo-auth
      - redis
      - rabbitmq
    networks:
      - saas-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  user-service:
    build: ./services/user-service
    container_name: user-service
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - MONGO_URI=mongodb://root:rootpassword@mongo-user:27017/users-db?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - RABBITMQ_URL=amqp://admin:password123@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo-user
      - redis
      - rabbitmq
    networks:
      - saas-network
    restart: unless-stopped

  restaurant-service:
    build: ./services/restaurant-service
    container_name: restaurant-service
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      - MONGO_URI=mongodb://root:rootpassword@mongo-restaurant:27017/restaurants-db?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - RABBITMQ_URL=amqp://admin:password123@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
      - CLOUDINARY_CLOUD_NAME=your_cloudinary_cloud
      - CLOUDINARY_API_KEY=your_cloudinary_key
      - CLOUDINARY_API_SECRET=your_cloudinary_secret
    depends_on:
      - mongo-restaurant
      - redis
      - rabbitmq
    networks:
      - saas-network
    restart: unless-stopped

  menu-service:
    build: ./services/menu-service
    container_name: menu-service
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - MONGO_URI=mongodb://root:rootpassword@mongo-menu:27017/menu-db?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - RABBITMQ_URL=amqp://admin:password123@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
      - CLOUDINARY_CLOUD_NAME=your_cloudinary_cloud
      - CLOUDINARY_API_KEY=your_cloudinary_key
      - CLOUDINARY_API_SECRET=your_cloudinary_secret
    depends_on:
      - mongo-menu
      - redis
      - rabbitmq
    networks:
      - saas-network
    restart: unless-stopped

  cart-service:
    build: ./services/cart-service
    container_name: cart-service
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - PORT=3006
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
    depends_on:
      - redis
    networks:
      - saas-network
    restart: unless-stopped

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - PORT=3007
      - MONGO_URI=mongodb://root:rootpassword@mongo-order:27017/orders-db?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - RABBITMQ_URL=amqp://admin:password123@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo-order
      - redis
      - rabbitmq
    networks:
      - saas-network
    restart: unless-stopped

  analytics-service:
    build: ./services/analytics-service
    container_name: analytics-service
    ports:
      - "3009:3009"
    environment:
      - NODE_ENV=production
      - PORT=3009
      - MONGO_URI=mongodb://root:rootpassword@mongo-analytics:27017/analytics-db?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - RABBITMQ_URL=amqp://admin:password123@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongo-analytics
      - redis
      - rabbitmq
    networks:
      - saas-network
    restart: unless-stopped

  review-service:
    build: ./services/review-service
    container_name: review-service
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - MONGO_URI=mongodb://root:rootpassword@mongo-review:27017/reviews-db?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - RABBITMQ_URL=amqp://admin:password123@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
      - CLOUDINARY_CLOUD_NAME=your_cloudinary_cloud
      - CLOUDINARY_API_KEY=your_cloudinary_key
      - CLOUDINARY_API_SECRET=your_cloudinary_secret
    depends_on:
      - mongo-review
      - redis
      - rabbitmq
    networks:
      - saas-network
    restart: unless-stopped

  location-service:
    build: ./services/location-service
    container_name: location-service
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - MONGO_URI=mongodb://root:rootpassword@mongo-restaurant:27017/restaurants-db?authSource=admin
      - JWT_SECRET=your_super_secret_jwt_key_change_in_production
      - REDIS_URL=redis://redis:6379
      - GOOGLE_MAPS_API_KEY=your_google_maps_key
    depends_on:
      - redis
    networks:
      - saas-network
    restart: unless-stopped
